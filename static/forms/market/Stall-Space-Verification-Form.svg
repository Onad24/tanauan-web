<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1500" viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bold { font-family: 'Arial', 'Helvetica Neue', sans-serif; font-weight: 900; }
      .semi { font-family: 'Arial', 'Helvetica Neue', sans-serif; font-weight: 700; }
      .regular { font-family: 'Arial', 'Helvetica Neue', sans-serif; font-weight: 500; }
      .title { font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1500" fill="#ffffff"/>

  <!-- Outer Border -->
  <rect x="30" y="30" width="1140" height="1440" rx="16" ry="16" fill="none" stroke="#111111" stroke-width="8"/>

  <!-- DATE -->
  <text x="650" y="95" class="bold" font-size="34" fill="#111111" letter-spacing="1">DATE:</text>
  <line x1="755" y1="102" x2="1100" y2="102" stroke="#111111" stroke-width="3"/>

  <!-- Header Title -->
  <text x="600" y="175" text-anchor="middle" class="title" font-size="52" fill="#111111" letter-spacing="1.5">STALL / SPACE VERIFICATION</text>
  <text x="600" y="230" text-anchor="middle" class="semi" font-style="italic" font-size="36" fill="#111111">(For Business Permit Issuance)</text>
  <line x1="220" y1="242" x2="980" y2="242" stroke="#111111" stroke-width="3"/>

  <!-- Top Form Fields -->
  <!-- STALL NO -->
  <text x="60" y="315" class="bold" font-size="32" fill="#111111" letter-spacing="0.5">STALL NO.:</text>
  <line x1="260" y1="322" x2="1100" y2="322" stroke="#111111" stroke-width="3"/>

  <!-- SECTION -->
  <text x="60" y="375" class="bold" font-size="32" fill="#111111" letter-spacing="0.5">SECTION:</text>
  <line x1="220" y1="382" x2="1100" y2="382" stroke="#111111" stroke-width="3"/>

  <!-- SERIAL NO -->
  <text x="60" y="435" class="bold" font-size="32" fill="#111111" letter-spacing="0.5">SERIAL NO.:</text>
  <line x1="265" y1="442" x2="1100" y2="442" stroke="#111111" stroke-width="3"/>

  <!-- Checklist items -->
  <!-- Box standard: x=240, width=42, height=42, rx=4, stroke=4 -->
  <!-- Text standard: x=310, font-size=35, bold -->

  <!-- 1. Latest Business Permit (Original) -->
  <rect x="240" y="495" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="530" class="bold" font-size="35" fill="#111111">Latest Business Permit (Original)</text>

  <!-- 2. DTI Registration -->
  <rect x="240" y="565" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="600" class="bold" font-size="35" fill="#111111">DTI Registration</text>

  <!-- 3. OR of Last Monthly Rental Paid -->
  <rect x="240" y="635" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="670" class="bold" font-size="35" fill="#111111">OR of Last Monthly Rental Paid</text>

  <!-- 4. OR of Last Electric/Water Bill Paid -->
  <rect x="240" y="705" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="740" class="bold" font-size="35" fill="#111111">OR of Last Electric/Water Bill Paid</text>

  <!-- 5. Meat Inspector's Clearance -->
  <rect x="240" y="775" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="810" class="bold" font-size="35" fill="#111111">Meat Inspector’s Clearance</text>

  <!-- 6. Existing Lease -->
  <rect x="240" y="845" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="880" class="bold" font-size="35" fill="#111111">Existing Lease</text>

  <!-- 7. Inspection of Stall -->
  <rect x="240" y="915" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="950" class="bold" font-size="35" fill="#111111">Inspection of Stall</text>

  <!-- 8. New Lease Contract -->
  <rect x="240" y="985" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="1020" class="bold" font-size="35" fill="#111111">New Lease Contract</text>

  <!-- 9. Others -->
  <rect x="240" y="1055" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="1090" class="bold" font-size="35" fill="#111111">Others</text>
  <line x1="445" y1="1098" x2="1080" y2="1098" stroke="#111111" stroke-width="3"/>

  <!-- 10. Validity or Valid until -->
  <rect x="240" y="1125" width="44" height="44" rx="4" fill="none" stroke="#111111" stroke-width="5"/>
  <text x="315" y="1160" class="bold" font-size="35" fill="#111111">Validity or Valid until</text>
  <line x1="680" y1="1168" x2="1080" y2="1168" stroke="#111111" stroke-width="3"/>

  <!-- Signatory -->
  <text x="600" y="1310" text-anchor="middle" class="bold" font-size="42" fill="#111111" text-decoration="underline">Engr. Lue M. Maderazo</text>
  <line x1="360" y1="1320" x2="840" y2="1320" stroke="#111111" stroke-width="5"/>
  <text x="600" y="1375" text-anchor="middle" class="bold" font-size="38" fill="#111111">Market Supervisor</text>
</svg>
